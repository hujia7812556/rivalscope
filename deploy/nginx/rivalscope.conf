# RivalScope(竞品观察)nginx 配置模板
#
# 架构说明:前端已通过 go:embed 嵌入 Go 二进制(单服务监听 127.0.0.1:17317,
# 同时提供页面与 /api/v1 接口),因此不需要静态 root、PHP fastcgi、swagger、
# 路径重写——nginx 只做 TLS 终止与全量反代。
#
# ⚠️ 这是模板文件,包含以下占位符,不能直接使用:
#   {{NGINX_SERVER_NAME}}  对外域名(如 rivalscope.jerehu.com)
# GitHub Actions 部署时会自动渲染;手动安装请先 sed 替换占位符:
#   sed 's|{{NGINX_SERVER_NAME}}|实际域名|g' deploy/nginx/rivalscope.conf | \
#       sudo tee /etc/nginx/conf.d/rivalscope.conf >/dev/null
#
# 证书:若已有 *.jerehu.com 泛域名证书可直接复用,否则先执行
#   certbot --nginx -d <域名>
# 签发后把下方 ssl_certificate 路径替换为实际路径。
#
# 部署:渲染后执行 nginx -t && nginx -s reload

# 80 端口:仅保留证书续期验证,其余一律跳转 https
server {
    listen      80;
    server_name {{NGINX_SERVER_NAME}};

    # letsencrypt http-01 续期验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    http2       on;   # nginx < 1.25.1 请改为:listen 443 ssl http2;
    server_name {{NGINX_SERVER_NAME}};

    ssl_certificate     /etc/letsencrypt/live/jerehu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jerehu.com/privkey.pem;

    access_log /var/log/nginx/rivalscope.access.log;
    error_log  /var/log/nginx/rivalscope.error.log;

    # gzip:嵌入的前端 JS 约 1.5MB,压缩后明显减小
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 页面与 /api/v1 接口同源同路径,直通反代到 Go 服务,无需重写
    location / {
        proxy_pass http://127.0.0.1:17317;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
